<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalshi Roku Demo</title>
</head>
<body>
<style>
/* Password gate — single-theme dark by design (TV context), colors from DESIGN.md */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#000;
  color:rgba(255,255,255,.92);
  font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
}
.gate{
  width:min(420px,90vw);
  background:#13161A;
  border:1.5px solid rgba(255,255,255,.10);
  border-radius:16px;
  padding:40px;
  display:flex;flex-direction:column;gap:20px;
  text-align:center;
}
.kdot{
  width:56px;height:56px;border-radius:14px;margin:0 auto;
  background:#28CC95;color:#00351F;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;
}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;}
p.sub{font-size:15px;line-height:1.45;color:rgba(255,255,255,.70);}
input{
  height:52px;border-radius:26px;
  background:#1A1D22;border:2px solid rgba(255,255,255,.16);
  color:rgba(255,255,255,.92);
  font-size:17px;text-align:center;letter-spacing:.04em;
  outline:none;width:100%;
}
input:focus{border-color:#28CC95;}
button{
  height:52px;border-radius:26px;border:none;cursor:pointer;
  background:#28CC95;color:#fff;
  font-size:17px;font-weight:600;width:100%;
  transition:transform .12s,opacity .12s;
}
button:hover{transform:scale(1.02);}
button:disabled{opacity:.5;transform:none;cursor:default;}
button:focus-visible{outline:3px solid rgba(40,204,149,.5);outline-offset:2px;}
.err{font-size:14px;color:#FF4D6A;min-height:18px;}
@media (prefers-reduced-motion: reduce){button{transition:none;}button:hover{transform:none;}}
</style>

<div class="gate">
  <div class="kdot">K</div>
  <h1>Kalshi &middot; Roku Prototype</h1>
  <p class="sub">This demo is password-protected.<br>Enter the password to open it.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
  <button id="go">Unlock</button>
  <div class="err" id="err"></div>
</div>

  const err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try {
    const raw = Uint8Array.from(atob(PAYLOAD_B64), c => c.charCodeAt(0));
    // OpenSSL salted format: "Salted__" + 8-byte salt + ciphertext
    const magic = new TextDecoder().decode(raw.slice(0,8));
    if (magic !== 'Salted__') throw new Error('bad payload');
    const salt = raw.slice(8,16);
    const ct = raw.slice(16);
    // openssl enc -aes-256-cbc -pbkdf2 -iter N -md sha256: key||iv = PBKDF2-SHA256(pw, salt, N, 48 bytes)
    const pwKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      {name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, pwKey, 48*8));
    const key = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
    const iv = bits.slice(32,48);
    const plain = await crypto.subtle.decrypt({name:'AES-CBC', iv}, key, ct);
    const html = new TextDecoder().decode(plain);
    if (!html.startsWith('<title>')) throw new Error('bad password');
    document.open();
    document.write('<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' + html + '</html>');
    document.close();
  } catch(e){
    btn.disabled = false; btn.textContent = 'Unlock';
    err.textContent = 'Wrong password. Try again.';
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
